# ~/.tmux.conf — zefro 기본 설정 (tmux 3.6 기준)
#
# ── 단축키 치트시트 ──────────────────────────────────────────────
#  ※ prefix = Ctrl+Space (보조: Ctrl+b도 됨). "prefix, x" = Ctrl+Space 누른 뒤 x.
#
#  [마우스 — prefix 불필요]
#    클릭            해당 pane으로 포커스 이동
#    테두리 드래그    pane 크기 조절
#    휠 스크롤       위로 굴리면 자동으로 스크롤(copy) 모드 진입
#    드래그 선택      놓는 순간 macOS 클립보드로 복사(pbcopy)
#    우클릭          컨텍스트 메뉴 (pane 닫기/분할 등)
#
#  [pane 이동 — prefix 불필요]
#    Alt(Option)+← → ↑ ↓   방향으로 pane 이동
#    ※ iTerm2에서 Alt가 안 먹으면: Settings > Profiles > Keys >
#      Left Option Key를 "Esc+"로 변경
#
#  [pane 분할/관리 — prefix 필요]
#    prefix, |   좌우 분할 (현재 디렉토리 유지)
#    prefix, -   상하 분할 (현재 디렉토리 유지)
#    prefix, z   현재 pane 전체화면 토글 (다시 누르면 복귀)
#    prefix, x   현재 pane 닫기 (확인 후)
#    prefix, m   main-vertical 레이아웃 (좌측 크게 + 우측 적층 — agent-team 타워형)
#    prefix, M   tiled 레이아웃 (바둑판)
#    prefix, H/J/K/L   pane 크기 조절 (연타 가능)
#
#  [창(window)]
#    Shift+← →   prefix 없이 이전/다음 창
#    Alt+1~5     prefix 없이 번호로 창 이동
#    prefix, c   새 창 (현재 디렉토리 유지)
#    prefix, Tab 직전 창 토글 (두 창 왔다갔다)
#    prefix, < > 창 순서 왼쪽/오른쪽으로 옮기기 (연타 가능)
#    prefix, ,   창 이름 바꾸기    prefix, &   창 닫기
#
#  [pane 추가 조작 — prefix 필요]
#    prefix, q   pane 번호 표시 → 숫자 눌러 점프
#    prefix, ;   직전 pane 토글
#    prefix, !   현재 pane을 새 창으로 분리
#    prefix, { } pane 위치 서로 바꾸기
#    prefix, S   ★ 모든 pane 동시 입력 토글 (워커 전체에 같은 지시 브로드캐스트)
#
#  [세션]
#    prefix, d   detach (세션은 백그라운드에 살아있음 → tmux attach 로 복귀)
#    prefix, s   세션 목록에서 선택 이동    prefix, $   세션 이름 바꾸기
#    prefix, w   전체 세션/창/pane 트리 미리보기로 탐색
#
#  [기타]
#    prefix, t   ★ 플로팅 스크래치 터미널 팝업 (exit 또는 Ctrl+d로 닫기)
#    prefix, r   이 설정 파일 리로드
#    prefix, [   스크롤(copy) 모드 진입 (q로 나감, vi 키로 이동, v선택 y복사, /로 검색)
# ─────────────────────────────────────────────────────────────────

# ── prefix: Ctrl+Space (기존 Ctrl+b도 보조로 유지) ──
# ※ 안 먹으면 macOS가 가로채는 것: 시스템 설정 > 키보드 > 단축키 > 입력 소스에서
#   "이전 입력 소스 선택"(Ctrl+Space) 비활성화 필요
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix              # 중첩 tmux(ssh 등)에 prefix 넘기기

# ── 기본 동작 ──
set -g mouse on                       # 마우스로 pane 선택·리사이즈·스크롤
set -g history-limit 50000            # 스크롤백 버퍼
set -g base-index 1                   # 창 번호 1부터 (0은 키보드에서 멀다)
setw -g pane-base-index 1
set -g renumber-windows on            # 창 닫으면 번호 재정렬
set -s escape-time 0                  # Esc 입력 지연 제거 (vim/TUI 반응성)
set -g focus-events on                # 포커스 이벤트를 앱(claude 등)에 전달
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # 트루컬러

# ── pane 테두리에 이름 표시 ──
# agent-team 워커는 @agent_name(고정)을, 그 외에는 pane_title을 보여준다.
set -g pane-border-status top
set -g pane-border-format ' #{?#{@agent_name},#{@agent_name},#{pane_title}} '
set -g pane-active-border-style 'fg=colour208'   # 활성 pane 주황 테두리
set -g pane-border-style 'fg=colour238'

# ── 상태바 ──
set -g status-style 'bg=colour235,fg=colour250'
set -g status-left ' #[bold]#S #[default]· '
set -g status-left-length 30
set -g status-right ' %m/%d %H:%M '
setw -g window-status-current-style 'bg=colour208,fg=colour232,bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-format ' #I:#W '

# ── 설정 리로드 ──
bind r source-file ~/.tmux.conf \; display "✓ tmux.conf 리로드"

# ── 분할: 직관적 기호 + 현재 pane의 디렉토리 유지 ──
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── pane 이동: prefix 없이 Alt+화살표 ──
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ── pane 크기 조절: prefix + H/J/K/L (연타 가능) ──
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── 레이아웃: agent-team 타워형 / 바둑판 ──
bind m set-window-option main-pane-width 45%\; select-layout main-vertical
bind M select-layout tiled

# ── 창(window) 조작 ──
bind c new-window -c "#{pane_current_path}"      # 새 창도 현재 디렉토리에서
bind -n S-Left  previous-window                  # prefix 없이 창 전환
bind -n S-Right next-window
bind -n M-1 select-window -t 1                   # prefix 없이 번호 점프
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind Tab last-window                             # 직전 창 토글
bind -r "<" swap-window -d -t -1                 # 창 순서 이동
bind -r ">" swap-window -d -t +1

# ── 모든 pane 동시 입력 토글 (agent-team 워커 전체 브로드캐스트) ──
bind S set-window-option synchronize-panes \; display "동시 입력: #{?pane_synchronized,ON — 모든 pane에 타이핑됨!,OFF}"

# ── 플로팅 스크래치 터미널 (tmux 3.2+) ──
bind t display-popup -E -d "#{pane_current_path}" -w 80% -h 75%

# ── 스크롤/복사 모드: vi 스타일 + macOS 클립보드 연동 ──
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
