"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$nodejs\
$bun\
$rust\
$golang\
$java\
$character"""

[directory]
style = "blue"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)"
symbol = " "
style = "bright-black"

[nodejs]
format = "[${symbol}(${version} )]($style)"
symbol = " "
style = "bright-black"

[bun]
format = "[${symbol}(${version} )]($style)"
symbol = "🥟 "
style = "bright-black"

[rust]
format = "[${symbol}(${version} )]($style)"
symbol = " "
style = "bright-black"

[golang]
format = "[${symbol}(${version} )]($style)"
symbol = " "
style = "bright-black"

[java]
format = "[${symbol}(${version} )]($style)"
symbol = " "
style = "bright-black"
