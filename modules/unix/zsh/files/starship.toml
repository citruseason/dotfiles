"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$nodejs\
$bun\
$rust\
$golang\
$java\
$character"""

[directory]
style = "blue"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = '\[[$symbol$branch]($style)\]'
style = "bright-black"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style))'
style = "cyan"

[git_state]
format = '\[[$state( $progress_current/$progress_total)]($style)\]'
style = "bright-black"

[cmd_duration]
format = '\[[⏱ $duration]($style)\]'
style = "yellow"

[python]
format = '\[[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style)\]'
style = "bright-black"

[nodejs]
format = '\[[$symbol($version)]($style)\]'
style = "bright-black"

[bun]
format = '\[[$symbol($version)]($style)\]'
style = "bright-black"

[rust]
format = '\[[$symbol($version)]($style)\]'
style = "bright-black"

[golang]
format = '\[[$symbol($version)]($style)\]'
style = "bright-black"

[java]
format = '\[[$symbol($version)]($style)\]'
style = "bright-black"

[username]
format = '\[[$user]($style)\]'

[hostname]
format = '\[[$ssh_symbol($hostname)]($style)\] '
